- type: custom:apexcharts-card
  graph_span: 90d
  span:
    end: day
  header:
    show: true
    title: Gewicht (90 Tage)
    show_states: true
    colorize_states: true
  apex_config:
    legend:
      show: false
    chart:
      height: 200
  yaxis:
  - decimals: 1
    apex_config:
      tickAmount: 4
  series:
  - entity: sensor.smart_scale_p1_gewicht
    name: Gewicht
    color: '#9C27B0'
    stroke_width: 2
    statistics: &id001
      type: mean
      period: day
      align: middle
    fill_raw: last
  - entity: sensor.smart_scale_p1_zielgewicht
    name: Zielgewicht
    color: '#4CAF50'
    stroke_width: 1
    statistics: *id001
    fill_raw: last
- type: custom:apexcharts-card
  graph_span: 90d
  span:
    end: day
  header:
    show: true
    title: Fett, Muskel & Wasser in %
    show_states: true
    colorize_states: true
  apex_config:
    legend:
      show: false
    chart:
      height: 200
  yaxis:
  - decimals: 0
    apex_config:
      tickAmount: 4
  series:
  - entity: sensor.smart_scale_p1_korperfett
    name: Fett
    color: '#FF9800'
    stroke_width: 2
    statistics: *id001
    fill_raw: last
  - entity: sensor.smart_scale_p1_muskelanteil
    name: Muskel
    color: '#E91E63'
    stroke_width: 2
    statistics: *id001
    fill_raw: last
  - entity: sensor.smart_scale_p1_korperwasser
    name: Wasser
    color: '#2196F3'
    stroke_width: 2
    statistics: *id001
    fill_raw: last
