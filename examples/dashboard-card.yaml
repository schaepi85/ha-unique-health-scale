# Beispiel-Dashboardkarte für die Unique Health Scale (Lefu)
#
# Zeigt alle Körperwerte mit Einstufung (blau = niedrig, grün = normal,
# orange = hoch) und Verläufe über 90 Tage. Tippen auf einen Wert öffnet
# seinen eigenen Verlauf.
#
# Benötigt (HACS → Frontend): Mushroom, stack-in-card, apexcharts-card;
# card-mod nur für den Hintergrund (sonst den card_mod-Block löschen).
#
# Die Entity-IDs gehen von einem Gerät namens "Smart Scale P1" und deutscher
# Oberfläche aus. Heißen sie bei dir anders, "sensor.smart_scale_p1_" per
# Suchen & Ersetzen anpassen.
#
# Einfügen: Dashboard bearbeiten → Karte hinzufügen → Manuell → Inhalt einfügen.

type: custom:stack-in-card
mode: vertical
card_mod:
  style: |
    ha-card {
      background: linear-gradient(135deg, rgba(156, 39, 176, 0.1) 0%, rgba(156, 39, 176, 0.05) 100%);
      border: 1px solid rgba(156, 39, 176, 0.2);
    }
cards:
- type: custom:mushroom-title-card
  title: ⚖️ Smart Scale P1
  subtitle: Körperanalyse & Verlauf
- type: grid
  columns: 2
  square: false
  cards:
  - type: custom:mushroom-template-card
    entity: sensor.smart_scale_p1_gewicht
    icon: mdi:scale-bathroom
    primary: '{% set s=states("sensor.smart_scale_p1_gewicht") %}{% if s in ["unknown","unavailable","none"] %}–{% else %}{{ "%.1f"|format(s|float) }} {{ state_attr("sensor.smart_scale_p1_gewicht","unit_of_measurement") or "" }}{% endif %}'
    secondary: Gewicht{% set r=state_attr("sensor.smart_scale_p1_gewicht","rating") %}{% if r %} · {{ {"low":"niedrig","normal":"normal","high":"hoch"}.get(r,r) }}{% endif %}
    icon_color: '{{ {"low":"blue","normal":"green","high":"orange"}.get(state_attr("sensor.smart_scale_p1_gewicht","rating"),"teal") }}'
    tap_action:
      action: more-info
  - type: custom:mushroom-template-card
    entity: sensor.smart_scale_p1_bmi
    icon: mdi:human-male-height
    primary: '{% set s=states("sensor.smart_scale_p1_bmi") %}{% if s in ["unknown","unavailable","none"] %}–{% else %}{{ "%.1f"|format(s|float) }} {{ state_attr("sensor.smart_scale_p1_bmi","unit_of_measurement") or "" }}{% endif %}'
    secondary: BMI{% set r=state_attr("sensor.smart_scale_p1_bmi","rating") %}{% if r %} · {{ {"low":"niedrig","normal":"normal","high":"hoch"}.get(r,r) }}{% endif %}
    icon_color: '{{ {"low":"blue","normal":"green","high":"orange"}.get(state_attr("sensor.smart_scale_p1_bmi","rating"),"teal") }}'
