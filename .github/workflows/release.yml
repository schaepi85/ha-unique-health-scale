name: Release

# Legt fuer jede neue Version in manifest.json automatisch ein GitHub-Release
# (Tag vX.Y.Z) an. Der Marketplace von Home Assistant bzw. HACS zeigt dann die
# Versionsnummer statt der Kennung des letzten Commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen, falls es fuer diese Version noch keines gibt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version custom_components/unique_health_scale/manifest.json)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unerwartete Version: $version" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag gibt es schon."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
